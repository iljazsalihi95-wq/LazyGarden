name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native source integrity
        run: python3 .github/scripts/check-native-source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LazyGarden-unit-tests-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
      - name: Record APK provenance
        run: |
          git rev-parse HEAD > app/build/outputs/apk/debug/commit-sha.txt
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk > apk-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: LazyGarden-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/
  device-tests:
    name: device-tests-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check native source integrity
        run: python3 .github/scripts/check-native-source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native game flow and save tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash .github/scripts/device-tests.sh ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LazyGarden-device-checks-${{ matrix.shard }}
          path: |
            device-screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
