name: Verify garden voice playback
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'app/src/main/java/com/lazygarden/game/GardenVoice.kt'
      - '.github/workflows/voice-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lazygarden-production-speech
jobs:
  deployed-speech:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify saved-clip fallback and cache routing
        run: node --test cloudflare-worker/test/*.mjs
      - name: Retrieve exact-language audio before installing a decoder
        id: fetch-audio
        if: always()
        shell: python
        run: |
          import json, pathlib, re, subprocess, urllib.request, urllib.error

          target = 'https://lazygarden.lazisalihi.workers.dev'
          output = pathlib.Path('voice-diagnostics')
          output.mkdir()
          report = {'endpoint': target, 'health': None, 'speech': []}
          headers = {'User-Agent': 'LazyGarden-Speech-Verification/1.0'}

          def error_details(error):
              if not isinstance(error, urllib.error.HTTPError):
                  return {'error': type(error).__name__}
              body = error.read(4096).decode('utf-8', errors='replace')
              match = re.search(r'error code:\s*(\d+)', body, re.I)
              result = {'status': error.code, 'edge_error': match[1] if match else None}
              for name in ('cf-ray', 'cf-mitigated', 'content-type'):
                  if error.headers.get(name):
                      result[name] = error.headers[name]
              try:
                  worker_error = json.loads(body).get('error')
                  if isinstance(worker_error, str) and re.fullmatch(r'[A-Z_]{1,60}', worker_error):
                      result['worker_error'] = worker_error
              except (ValueError, AttributeError):
                  pass
              return result

          for actor, language, text in [('meli', 'sq', 'Nuk del ujë. Lazi, na ndihmon?'),
                                        ('meli', 'it', 'Non esce acqua. Lazi, ci aiuti?')]:
              result = {'actor': actor, 'language': language, 'audio': False, 'downloaded': False}
              clip = output / (actor + '-' + language + '.mp3')
              try:
                  request = urllib.request.Request(
                      target + '/api/game/voice',
                      data=json.dumps({'scene_id': 'fountain_quest', 'line_id': 'call_lazi', 'character_id': actor, 'language': language, 'text': text}).encode(),
                      headers={**headers, 'Content-Type': 'application/json'})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      payload = response.read(4 * 1024 * 1024 + 1)
                      result.update(status=response.status, bytes=len(payload), source=response.headers.get('X-Garden-Voice-Source'))
                      if response.headers.get_content_type() == 'audio/mpeg' and 128 < len(payload) <= 4 * 1024 * 1024:
                          clip.write_bytes(payload)
                          result['downloaded'] = True
              except Exception as error:
                  result.update(error_details(error))
              if not result['downloaded']:
                  clip.unlink(missing_ok=True)
              report['speech'].append(result)

          evidence = json.dumps(report, ensure_ascii=False, indent=2)
          (output / 'report.json').write_text(evidence)
          print(evidence)
          if not all(result['downloaded'] for result in report['speech']):
              raise SystemExit('Production speech did not return MPEG audio in both languages')
      - name: Install decoder only after receiving real audio
        if: success()
        timeout-minutes: 2
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y ffmpeg
          fi
      - name: Decode both received character voices
        if: success()
        shell: python
        run: |
          import json, pathlib, subprocess
          output = pathlib.Path('voice-diagnostics')
          report = json.loads((output / 'report.json').read_text())
          for result in report['speech']:
              clip = output / (result['actor'] + '-' + result['language'] + '.mp3')
              try:
                  decoded = subprocess.run(['ffmpeg', '-v', 'error', '-xerror', '-i', str(clip),
                                            '-map', '0:a:0', '-f', 's16le', 'pipe:1'],
                                           stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15)
                  result['audio'] = decoded.returncode == 0 and len(decoded.stdout) > 8192
              except Exception as error:
                  result['audio'] = False
                  result['decoder_error'] = type(error).__name__
          (output / 'report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if not all(result['audio'] for result in report['speech']):
              raise SystemExit('Production speech failed to decode in both languages')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-garden-speech
          path: voice-diagnostics/
          if-no-files-found: ignore
