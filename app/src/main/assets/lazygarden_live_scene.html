<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c2e;font-family:system-ui,sans-serif}.world{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#8ed8ff 0 34%,#5aa64e 34% 100%)}.sun{position:absolute;width:15vmin;height:15vmin;border-radius:50%;background:#ffe89a;right:8%;top:7%;box-shadow:0 0 45px #fff2a8}.house{position:absolute;left:25%;top:18%;width:50%;height:38%;background:linear-gradient(#f4d7aa,#d6a66f);border-radius:18px 18px 3px 3px;box-shadow:0 12px 30px #163b2a66}.roof{position:absolute;left:-7%;top:-17%;width:114%;height:24%;background:#9e4935;clip-path:polygon(50% 0,100% 100%,0 100%)}.door{position:absolute;width:18%;height:43%;left:41%;bottom:0;background:#70452e;border-radius:40px 40px 0 0}.window{position:absolute;width:17%;height:22%;top:26%;background:#bceaff;border:6px solid #fff0cc}.w1{left:13%}.w2{right:13%}.path{position:absolute;left:35%;bottom:-8%;width:30%;height:55%;background:linear-gradient(90deg,#baa98d,#e5d5b9,#b7a487);clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}.fountain{position:absolute;left:45%;top:58%;width:12%;height:10%;border-radius:50%;background:#79c7e7;border:7px solid #d8d0b7;box-shadow:0 8px 14px #173b2b66}.flower{position:absolute;width:14px;height:14px;border-radius:50%;background:#ff79a8;box-shadow:14px 3px #ffd84e,-10px 7px #b88cff}.f1{left:16%;top:65%}.f2{right:18%;top:71%}.char{--skin:#efbd91;position:absolute;width:64px;height:128px;transform-origin:50% 100%;filter:drop-shadow(0 7px 4px #173b2b55);transition:left 2.2s ease-in-out,top 2.2s ease-in-out}.head{position:absolute;left:18px;top:4px;width:31px;height:35px;border-radius:48% 48% 45% 45%;background:var(--skin);z-index:3}.hair{position:absolute;left:15px;top:0;width:37px;height:18px;border-radius:50% 50% 30% 30%;background:#563728;z-index:4}.eye{position:absolute;top:16px;width:3px;height:4px;border-radius:50%;background:#25302c}.e1{left:8px}.e2{right:8px}.mouth{position:absolute;left:11px;top:25px;width:10px;height:2px;border-radius:50%;background:#8f3e3b}.body{position:absolute;left:13px;top:36px;width:41px;height:53px;border-radius:13px 13px 8px 8px;background:#3d7fba}.arm,.leg{position:absolute;width:12px;border-radius:8px;transform-origin:50% 0}.arm{height:48px;top:42px;background:var(--skin)}.a1{left:8px}.a2{right:3px}.leg{height:48px;top:82px;background:#314b68}.l1{left:18px}.l2{right:13px}.char.walk{animation:bob .42s infinite alternate}.walk .a1,.walk .l2{animation:swing .55s infinite alternate}.walk .a2,.walk .l1{animation:swing .55s infinite alternate-reverse}.char.talk .mouth{animation:talk .18s infinite alternate}.char.talk .a2{animation:gesture .7s infinite alternate}.char.work{animation:work .32s infinite alternate}.char.work .a1,.char.work .a2{animation:hammer .32s infinite alternate}.bubble{position:absolute;min-width:135px;max-width:190px;padding:9px 12px;border-radius:16px;background:#fff;color:#273a32;font-weight:700;font-size:12px;box-shadow:0 5px 16px #0004;opacity:0;transform:translate(-50%,-115%) scale(.8);transition:.2s;pointer-events:none}.bubble.show{opacity:1;transform:translate(-50%,-115%) scale(1)}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#ffe165;pointer-events:none;animation:spark .8s forwards}.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;justify-content:center}.pill{padding:8px 13px;border-radius:22px;background:#fffde8e8;box-shadow:0 5px 15px #173b2b55;font-weight:900;color:#31583f}.task{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:11px 18px;border-radius:20px;background:#257e4c;color:white;font-weight:900;box-shadow:0 7px 0 #165c36,0 10px 20px #0004}@keyframes bob{to{transform:translateY(-3px)}}@keyframes swing{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}@keyframes talk{to{height:7px;border-radius:50%}}@keyframes gesture{to{transform:rotate(-65deg)}}@keyframes work{to{transform:translateY(2px) rotate(1.5deg)}}@keyframes hammer{to{transform:rotate(-55deg)}}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}</style></head><body><div class="world" id="world"><div class="sun"></div><div class="house"><div class="roof"></div><div class="door"></div><div class="window w1"></div><div class="window w2"></div></div><div class="path"></div><div class="fountain" id="work"></div><div class="flower f1"></div><div class="flower f2"></div><div class="hud"><div class="pill">❤️ 5</div><div class="pill">🪙 2450</div><div class="pill">⭐ 12</div></div><div class="task">Restauro shatërvanin</div></div><script>const W=document.getElementById('world'),target=document.getElementById('work');const cast=[['Meti','#3d7fba',12,72],['Bejdi','#5d8f4b',76,69],['Meli','#b85e86',22,58],['Lina','#8d68bd',70,56]];function make([name,color,x,y],i){let e=document.createElement('div');e.className='char walk';e.style.left=x+'%';e.style.top=y+'%';e.innerHTML=`<div class="hair"></div><div class="head"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div><div class="body" style="background:${color}"></div><i class="arm a1"></i><i class="arm a2"></i><i class="leg l1"></i><i class="leg l2"></i><div class="bubble">${name}: Hajde ta rregullojmë bashkë!</div>`;W.appendChild(e);return e}const people=cast.map(make);function pos(e,x,y){e.style.left=x+'%';e.style.top=y+'%'}function bubbles(e,on){e.querySelector('.bubble').classList.toggle('show',on)}function sparks(){let r=target.getBoundingClientRect(),w=W.getBoundingClientRect();for(let i=0;i<12;i++){let s=document.createElement('i');s.className='spark';s.style.left=(r.left-w.left+r.width/2)+'px';s.style.top=(r.top-w.top+r.height/2)+'px';s.style.setProperty('--dx',(Math.random()*100-50)+'px');s.style.setProperty('--dy',(Math.random()*-80)+'px');W.appendChild(s);setTimeout(()=>s.remove(),900)}}async function cycle(){people.forEach((p,i)=>{p.className='char walk';bubbles(p,false);pos(p,18+i*18,64-(i%2)*8)});await wait(2600);people[0].className='char talk';people[1].className='char talk';bubbles(people[0],true);await wait(1300);bubbles(people[0],false);bubbles(people[1],true);await wait(1200);bubbles(people[1],false);people.slice(0,3).forEach((p,i)=>{p.className='char walk';pos(p,43+i*7,58+i*2)});await wait(2400);people.slice(0,3).forEach(p=>p.className='char work');for(let i=0;i<8;i++){sparks();await wait(380)}people.forEach(p=>p.className='char walk');await wait(1200);cycle()}function wait(ms){return new Promise(r=>setTimeout(r,ms))}setTimeout(cycle,700);</script></body></html>
